; RP-f405-board board_options.ini
; Default voltage table values for CLT and IAT sensors.
;
; These tables assume:
;   - NTC sensor with on-board 2.49k pull-up to 5V, op-amp buffered to 3.3V
;   - Voltage values are at the ADC input (0..3.3V range scaled to 0..5V here
;     because rusefi voltage table uses the raw 0-5V sensor supply reference)
;   - Temperatures in degrees Celsius
;
; Adjust breakpoints to match your actual sensor characteristic curve.
; Values below are a reasonable starting point for a generic NTC sensor.

[defaultValue]

; CLT voltage table (16 breakpoints, voltage ascending 0..5V)
; Voltage:     0.10  0.30  0.50  0.70  0.90  1.10  1.30  1.50  1.80  2.10  2.40  2.70  3.00  3.30  3.60  4.00
cltVoltageTable_volts = 0.10 0.30 0.50 0.70 0.90 1.10 1.30 1.50 1.80 2.10 2.40 2.70 3.00 3.30 3.60 4.00

; Temperature at each voltage breakpoint (deg C)
; High voltage = cold sensor (high resistance), low voltage = hot sensor (low resistance)
cltVoltageTable_temps = 130 110 95 82 70 58 47 37 23 10 -2 -13 -23 -32 -40 -50

; IAT voltage table (same sensor type assumed)
iatVoltageTable_volts = 0.10 0.30 0.50 0.70 0.90 1.10 1.30 1.50 1.80 2.10 2.40 2.70 3.00 3.30 3.60 4.00
iatVoltageTable_temps = 130 110 95 82 70 58 47 37 23 10 -2 -13 -23 -32 -40 -50
