; RP-f405-board board_options.ini
; Default voltage table values for CLT and IAT sensors.
;
; These tables assume:
;   - NTC sensor with on-board 2.49k pull-up to 5V, op-amp buffered to 3.3V
;   - Voltage values are at the ADC input (0..3.3V range scaled to 0..5V here
;     because rusefi voltage table uses the raw 0-5V sensor supply reference)
;   - Temperatures in degrees Celsius
;
; Adjust breakpoints to match your actual sensor characteristic curve.
; Values below are a reasonable starting point for a generic NTC sensor.
